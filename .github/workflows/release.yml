name: Build release

on:
  push:
    branches: [ main, develop ]
    tags: [ '*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering by a user with write access to this repo

permissions:
  contents: read
  packages: read

# Catalogue publication and previous-release selection must not overlap.
concurrency:
  group: pipelines-release-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'tags' || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  validate-catalogue:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Test release producer
      run: |
        pip install -r requirements-release.txt pytest
        python -m pytest --noconftest -q tests/test_release_catalogue.py tests/test_release_workflow.py

  # MONAI specs are generated by scripts/monai_specs.py (see monai-sync.yml),
  # so hand-listing them in the matrix below would go stale every time a model
  # is added to the whitelist. Discover them instead. Non-MONAI specs stay
  # hand-listed: several are deliberately disabled, and that intent is not
  # recorded anywhere a discovery rule could read.
  discover-specs:
    needs: validate-catalogue
    runs-on: ubuntu-24.04
    outputs:
      specs: ${{ steps.plan.outputs.specs }}
      has-builds: ${{ steps.plan.outputs.has-builds }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install release planning dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-release.txt
        pip install .

    - name: Discover selected specs
      env:
        # Hand-maintained, one per line. Several other specs exist but are
        # deliberately not built; that intent is not recorded in the specs
        # themselves, so it cannot be inferred by a discovery rule.
        HAND_LISTED: |
          quality-control/phi-finder
          mri/human/neuro/t1w/preprocess
      run: |
        set -euo pipefail
        # Generated MONAI specs are discovered rather than listed, so adding a
        # model to the whitelist does not also require editing this workflow.
        {
          printf '%s\n' "$HAND_LISTED"
          find specs/australian-imaging-service -path '*/monai/*.yaml' \
            | sed 's|^specs/australian-imaging-service/||; s|\.yaml$||'
        } | sed '/^[[:space:]]*$/d' | sort -u > selected-specs.txt

        echo "Selected specs:"
        cat selected-specs.txt

    - name: Plan pipeline builds
      id: plan
      env:
        P2A_ACCESS_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
      run: |
        set -euo pipefail
        mapfile -t selected_specs < selected-specs.txt
        if (( ${#selected_specs[@]} == 0 )); then
          echo "No pipeline specs were selected" >&2
          exit 1
        fi

        spec_args=()
        for spec in "${selected_specs[@]}"; do
          spec_args+=(--spec "$spec")
        done

        pydra2app plan-builds xnat specs/australian-imaging-service \
          --spec-root specs \
          --registry ghcr.io \
          "${spec_args[@]}" > release-plan.json

        python -m scripts.release_catalogue inventory \
          --plan release-plan.json \
          --spec-root specs \
          --spec-dir specs/australian-imaging-service \
          --output release-inventory.json

        cat release-plan.json
        specs=$(jq -c '.build' release-plan.json)
        echo "specs=$specs" >> "$GITHUB_OUTPUT"
        echo "has-builds=$(jq -r '.build | length > 0' release-plan.json)" \
          >> "$GITHUB_OUTPUT"

    - name: Upload release plan
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-release-plan
        path: |
          release-plan.json
          release-inventory.json
        if-no-files-found: error

  deploy:
    needs: discover-specs
    if: needs.discover-specs.outputs.has-builds == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # plan-builds filters HAND_LISTED + generated MONAI specs down to new
        # and version-incremented pipelines.
        # Currently disabled (add to HAND_LISTED there to re-enable; note the
        # directory is `bidsapp`, not `bidsapps` as these stale entries say):
        #   mri/human/neuro/bidsapps/fmriprep
        #   mri/human/neuro/bidsapps/mriqc
        #   mri/human/neuro/bidsapps/smriprep
        #   mri/human/neuro/t1w/preprocess
        spec: ${{ fromJSON(needs.discover-specs.outputs.specs) }}
    steps:
    - name: Removed unnecessary tools to free space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download release inventory
      uses: actions/download-artifact@v4
      with:
        name: pipeline-release-plan

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Update build tools
      run: python -m pip install --upgrade pip

    - name: Install dependencies & pipelines package
      run: |
        pip install -r requirements.txt
        pip install -r requirements-release.txt
        pip install .

    - name: Install spec-specific requirements if they exist
      env:
        SPEC: ${{ matrix.spec }}
      run: |
        if [ -f "./requirements/$SPEC.txt" ]; then
          echo "Installing spec-specific requirements for $SPEC"
          pip install -r "./requirements/$SPEC.txt"
        else
          echo "No spec-specific requirements found for $SPEC"
        fi

    # MONAI model weights are not committed (they are large, re-downloadable
    # and already versioned in the Model Zoo), so the bundle each generated
    # spec declares as a resource must be fetched before the build. Pinned to
    # the version recorded in the spec. No-op for non-MONAI specs.
    - name: Fetch MONAI bundle resources
      if: contains(matrix.spec, '/monai/')
      run: |
        pip install -e ".[monai]"
        python -m scripts.monai_specs fetch-resources --resources-dir ./resources

    - name: Login to Docker registry
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ secrets.GHCR_TOKEN && 'tclose' || github.actor }}
        password: ${{ secrets.GHCR_TOKEN || github.token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Get the tag of the Docker image to be built
      env:
        SPEC: ${{ matrix.spec }}
      run: |
        python -m scripts.release_catalogue image-env \
          --inventory release-inventory.json \
          --spec "$SPEC" --output "$GITHUB_ENV"

    - name: Build container image
      env:
        P2A_DOCKER_USER: tclose
        P2A_ACCESS_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        SPEC: ${{ matrix.spec }}
      run: |
        pydra2app make xnat "./specs/australian-imaging-service/$SPEC.yaml" \
          --registry ghcr.io --loglevel info \
          --resources-dir ./resources --spec-root ./specs --dont-check-registry --source-package .

    - name: Dump XNAT command JSON to file
      run: |
        set -euo pipefail
        mkdir -p xnat_commands
        container=$(docker create --entrypoint /bin/true "$IMAGE_TAG")
        trap 'docker rm "$container" >/dev/null' EXIT
        while IFS= read -r command; do
          docker cp "$container:/xnat_commands/$command.json" "./xnat_commands/$command.json"
        done < <(jq -r '.[]' <<< "$COMMAND_NAMES_JSON")

    - name: Upload XNAT command JSON artifacts
      uses: actions/upload-artifact@v4
      with:
        name: xnat-commands-${{ strategy.job-index }}
        path: ./xnat_commands/*.json
        if-no-files-found: error

    - name: Push built Docker image
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      run: docker push "$IMAGE_TAG"

    - name: Record immutable image and commands
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      env:
        SPEC: ${{ matrix.spec }}
      run: |
        python -m scripts.release_catalogue record \
          --inventory release-inventory.json --spec "$SPEC" \
          --commands-dir xnat_commands --output-dir release-entry

    - name: Upload immutable release entry
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-entry-${{ strategy.job-index }}
        path: release-entry/
        if-no-files-found: error

  publish-catalogue:
    needs: [discover-specs, deploy]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.discover-specs.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install catalogue dependencies
      run: pip install -r requirements-release.txt
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ secrets.GHCR_TOKEN && 'tclose' || github.actor }}
        password: ${{ secrets.GHCR_TOKEN || github.token }}
    - name: Download release plan and inventory
      uses: actions/download-artifact@v4
      with:
        name: pipeline-release-plan
    - name: Download built entries
      if: needs.discover-specs.outputs.has-builds == 'true'
      uses: actions/download-artifact@v4
      with:
        pattern: pipeline-entry-*
        path: built-entries
    - name: Retrieve previous published catalogue
      run: |
        python -m scripts.release_catalogue previous \
          --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
          --output-dir previous
        if [ -f previous/pipeline-release.json ]; then
          previous_commit=$(jq -er '.source.commit' previous/pipeline-release.json)
          if ! git merge-base --is-ancestor "$previous_commit" "$SOURCE_COMMIT"; then
            echo "Previous catalogue is not an ancestor of this release; refusing to roll back the release channel" >&2
            exit 1
          fi
        fi
    - name: Assemble and validate complete release
      run: |
        mkdir -p built-entries
        python -m scripts.release_catalogue assemble \
          --inventory release-inventory.json --plan release-plan.json \
          --entries-dir built-entries --previous-dir previous \
          --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
          --commit "$SOURCE_COMMIT" --output-dir release-assets
    - name: Retain candidate catalogue
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-release-catalogue
        path: release-assets/
        if-no-files-found: error
    - name: Publish complete GitHub Release
      run: |
        python -m scripts.release_catalogue publish \
          --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
          --commit "$SOURCE_COMMIT" --assets-dir release-assets
