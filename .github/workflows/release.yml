# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Build release

on:
  push:
    branches: [ main, develop ]
    tags: [ '*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering by a user with write access to this repo

permissions:
  contents: read
  packages: write  # required for pushing to ghcr.io

jobs:
  # MONAI specs are generated by scripts/monai_specs.py (see monai-sync.yml),
  # so hand-listing them in the matrix below would go stale every time a model
  # is added to the whitelist. Discover them instead. Non-MONAI specs stay
  # hand-listed: several are deliberately disabled, and that intent is not
  # recorded anywhere a discovery rule could read.
  discover-specs:
    runs-on: ubuntu-24.04
    outputs:
      specs: ${{ steps.find.outputs.specs }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Build the spec matrix
      id: find
      env:
        # Hand-maintained, one per line. Several other specs exist but are
        # deliberately not built; that intent is not recorded in the specs
        # themselves, so it cannot be inferred by a discovery rule.
        HAND_LISTED: |
          quality-control/phi-finder
      run: |
        set -euo pipefail
        # Generated MONAI specs are discovered rather than listed, so adding a
        # model to the whitelist does not also require editing this workflow.
        discovered=$(find specs/australian-imaging-service -path '*/monai/*.yaml' \
          | sed 's|^specs/australian-imaging-service/||; s|\.yaml$||')
        specs=$( { echo "$HAND_LISTED"; echo "$discovered"; } \
          | sed '/^[[:space:]]*$/d' | sort -u | jq -R . | jq -c -s . )
        echo "Building specs: $specs"
        echo "specs=$specs" >> "$GITHUB_OUTPUT"

  deploy:
    needs: discover-specs
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Built from HAND_LISTED + discovered MONAI specs in discover-specs.
        # Currently disabled (add to HAND_LISTED there to re-enable; note the
        # directory is `bidsapp`, not `bidsapps` as these stale entries say):
        #   mri/human/neuro/bidsapps/fmriprep
        #   mri/human/neuro/bidsapps/mriqc
        #   mri/human/neuro/bidsapps/smriprep
        #   mri/human/neuro/t1w/preprocess
        spec: ${{ fromJSON(needs.discover-specs.outputs.specs) }}
    steps:
    - name: Removed unnecessary tools to free space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y yq

    - name: Checkout
      uses: actions/checkout@v2

    - name: Get release tag
      run: |
        git fetch --prune --unshallow
        echo "RELEASE=`echo $(git describe --tags --abbrev=0)`" >> $GITHUB_ENV

    - name: Unset header
      # checkout@v2 adds a header that makes branch protection report errors
      # because the Github action bot is not a collaborator on the repo
      run: git config --local --unset http.https://github.com/.extraheader

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Update build tools
      run: python -m pip install --upgrade pip

    - name: Install dependencies & pipelines package
      run: |
        pip install -r requirements.txt
        pip install .

    - name: Install spec-specific requirements if they exist
      run: |
        if [ -f "./requirements/${{ matrix.spec }}.txt" ]; then
          echo "Installing spec-specific requirements for ${{ matrix.spec }}"
          pip install -r "./requirements/${{ matrix.spec }}.txt"
        else
          echo "No spec-specific requirements found for ${{ matrix.spec }}"
        fi

    # MONAI model weights are not committed (they are large, re-downloadable
    # and already versioned in the Model Zoo), so the bundle each generated
    # spec declares as a resource must be fetched before the build. Pinned to
    # the version recorded in the spec. No-op for non-MONAI specs.
    - name: Fetch MONAI bundle resources
      if: contains(matrix.spec, '/monai/')
      run: |
        pip install -e ".[test]"
        python -m scripts.monai_specs fetch-resources --resources-dir ./resources

    - name: Login to Docker registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: tclose
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Get the tag of the Docker image to be built
      id: version
      run: |
        SPEC_VERSION=$(yq -r '.version' ./specs/australian-imaging-service/${{ matrix.spec }}.yaml)
        PIPELINE_NAME="${{ matrix.spec }}"
        PIPELINE_NAME="${PIPELINE_NAME//\//.}"
        IMAGE_TAG=ghcr.io/australian-imaging-service/${PIPELINE_NAME}:${SPEC_VERSION}
        echo "IMAGE_TAG=$IMAGE_TAG"
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        echo "PIPELINE_NAME=$PIPELINE_NAME" >> $GITHUB_ENV

    - name: Build and push container images
      env:
        P2A_DOCKER_USER: tclose
        P2A_ACCESS_TOKEN: ${{ secrets.GHCR_TOKEN }}
      run: >
        pydra2app make xnat ./specs/australian-imaging-service/${{ matrix.spec }}.yaml
        --registry ghcr.io --loglevel info
        --resources-dir ./resources --spec-root ./specs --dont-check-registry --source-package .
      # --release pipelines-metapackage $RELEASE --tag-latest --check-registry --clean-up 

    - name: Dump XNAT command JSON to file
      run: |
        mkdir -p ./xnat_commands
        for command in $(yq -r '.commands | keys | join(" ")' ./specs/australian-imaging-service/${{ matrix.spec }}.yaml); do
          echo "Extracting command: $command"
          docker run --entrypoint cat ${{ env.IMAGE_TAG }} /xnat_commands/${command}.json > ./xnat_commands/${command}.json
        done

    - name: Upload XNAT command JSON artifacts
      uses: actions/upload-artifact@v4
      with:
        name: xnat-commands-${{ env.PIPELINE_NAME }}
        path: ./xnat_commands/*.json
        
    - name: List Docker images
      run: docker images   
    - name: Push built Docker image
      id: deployable
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
      run: docker push ${{ env.IMAGE_TAG }}

    - name: Display XNAT command JSONs
      run: |
        for command in $(yq -r '.commands | keys | join(" ")' ./specs/australian-imaging-service/${{ matrix.spec }}.yaml); do
          echo "### $command ###"
          docker run --rm --entrypoint cat ${{ env.IMAGE_TAG }} /xnat_commands/${command}.json
        done
