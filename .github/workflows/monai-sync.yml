name: Sync MONAI model specs

on:
  schedule:
    # 16:00 UTC Sunday = 02:00 Monday in Sydney during AEST (UTC+10). Cron has
    # no timezone, so this lands at 03:00 Monday over AEDT (UTC+11) -- fine for
    # a weekly background sync, and not worth chasing with two schedules.
    - cron: "0 16 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write       # create-pull-request pushes the sync branch
  pull-requests: write  # ...and opens the PR
  issues: write         # the triage step opens an issue

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Generate/update MONAI specs
        run: python -m scripts.monai_specs sync
      - name: Open PR with changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: monai-spec-sync
          base: main
          title: "Update MONAI model specs"
          commit-message: "chore(monai): sync model specs from Model Zoo"
          body: "Automated MONAI Model Zoo spec sync. Review generated specs and task modules before merge."
          # NB: must cover the __init__.py files write_task_module creates at
          # every level from the package root down, not just those under a
          # `monai` segment — a task module whose parent packages lack
          # __init__.py cannot be imported via its dotted command.task ref.
          # Model weights are excluded by .gitignore, so the wide src pattern
          # cannot stage anything large.
          add-paths: |
            specs/**/monai/**
            src/australianimagingservice/**

      # Triage runs after the sync PR so the report reflects decisions already
      # recorded. It reports models needing a human decision -- new Zoo bundles,
      # declined models whose version has moved on, and approved models that have
      # disappeared from the Zoo (which `filter_whitelist` otherwise skips
      # silently, leaving a spec building against a model that no longer exists).
      - name: Report models awaiting triage
        id: triage
        run: python -m scripts.monai_specs triage --output triage-report.md
      - name: Open triage issue
        if: steps.triage.outputs.needs-triage == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # The board filters on the native issue type, which `gh issue create`
          # cannot set (no --type flag as of gh 2.93), so it is applied after
          # creation via GraphQL. Without it the issue exists but is invisible
          # on the project board.
          TASK_TYPE_ID: IT_kwDOA_RNg84Avy8y
        run: |
          set -euo pipefail
          url=$(gh issue create \
            --title "MONAI model triage — $(date -u +%Y-%m-%d)" \
            --body-file triage-report.md \
            --label S4)
          echo "Opened $url"
          number=${url##*/}
          id=$(gh api graphql -f query='
            query($number: Int!) {
              repository(owner: "Australian-Imaging-Service", name: "pipelines") {
                issue(number: $number) { id }
              }
            }' -F number="$number" --jq '.data.repository.issue.id')
          gh api graphql -f query='
            mutation($id: ID!, $type: ID!) {
              updateIssue(input: {id: $id, issueTypeId: $type}) {
                issue { number issueType { name } }
              }
            }' -f id="$id" -f type="$TASK_TYPE_ID" --jq '.data.updateIssue.issue.issueType.name'
