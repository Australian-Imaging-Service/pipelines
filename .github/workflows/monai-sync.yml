name: Sync MONAI model specs

on:
  schedule:
    - cron: "0 3 * * 1"   # 03:00 UTC every Monday
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Generate/update MONAI specs
        run: python -m scripts.monai_specs sync
      - name: Open PR with changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: monai-spec-sync
          base: main
          title: "Update MONAI model specs"
          commit-message: "chore(monai): sync model specs from Model Zoo"
          body: "Automated MONAI Model Zoo spec sync. Review generated specs and task modules before merge."
          # NB: must cover the __init__.py files write_task_module creates at
          # every level from the package root down, not just those under a
          # `monai` segment — a task module whose parent packages lack
          # __init__.py cannot be imported via its dotted command.task ref.
          # Model weights are excluded by .gitignore, so the wide src pattern
          # cannot stage anything large.
          add-paths: |
            specs/**/monai/**
            src/australianimagingservice/**
