# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: check-spec
        name: check-spec (check spec can be loaded by pydra2app)
        entry: python scripts/check_yaml.py
        language: python
        additional_dependencies: [pydra2app>=0.22.2]
        types: [yaml]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      # The ruff settings are in src/pyproject.toml, as that is where the package is
      - id: ruff-check
        args:
          - --fix
          - --config=src/pyproject.toml
      - id: ruff-format
        args:
          - --config=src/pyproject.toml
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        exclude: ^(src/australianimagingservice/_version\.py)$
        args:
          - --ignore-words=.codespell-ignorewords
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        # Strict mode is set in src/pyproject.toml rather than with --strict here, as
        # --strict would override the exceptions made there
        args: [--install-types, --non-interactive, --no-warn-unused-ignores, --config-file=src/pyproject.toml]
        # Matches the exclude in src/pyproject.toml's [tool.mypy], which only applies to
        # files mypy finds itself, not to those pre-commit passes it
        exclude: (^|/)tests/|^(scripts|docs)/|^conftest\.py$
        # numpy is pinned below 2.5, the first release to require Python 3.12, because
        # mypy checks against Python 3.11 (src/pyproject.toml) and can't parse the
        # 3.12-only syntax in its stubs. imageio would otherwise pull in the latest.
        additional_dependencies: [pytest, attrs, imageio, pydicom, "numpy<2.5"]
  - repo: https://github.com/google/yamlfmt
    rev: v0.19.0
    hooks:
      - id: yamlfmt
