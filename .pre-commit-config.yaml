# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: check-yaml
        name: check-yaml (tolerating repo's custom tags, e.g. '!join')
        entry: python scripts/check_yaml.py
        language: python
        additional_dependencies: [pydra2app>=0.22.2]
        types: [yaml]
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        language_version: python3.13
        exclude: ^(src/australianimagingservice/_version\.py)$
        args:
          - -l 88
          - --config=src/pyproject.toml
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        exclude: ^(src/australianimagingservice/_version\.py)$
        args:
          - --ignore-words=.codespell-ignorewords
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args:
          - --extend-ignore=E203,E501,E129,W503,E701
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: [--strict, --install-types, --non-interactive, --no-warn-unused-ignores, --config-file=src/pyproject.toml]
        exclude: tests
        additional_dependencies: [pytest, attrs, imageio, pydicom]
  - repo: https://github.com/google/yamlfmt
    rev: v0.19.0
    hooks:
      - id: yamlfmt
