[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "australianimagingservice"
description = "Analysis pipelines library of the Australian Imaging Service"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fileformats",
    "fileformats-medimage-extras",
    "pydra >=1.0a",
    # imported at module level by the generated MONAI task modules committed
    # under src/australianimagingservice/**/monai/, so it is needed to import
    # this package at all -- both on the build host when pipeline2app resolves
    # command.task, and inside the built image at run time.
    # >=0.1.4 maps NIfTI bundle inputs to NiftiGz rather than NiftiGzX; earlier
    # versions generate specs that reject side-car-less .nii.gz data.
    "pydra-compose-monai >=0.1.4",
    # arrives transitively via pydra-compose-monai, but scripts/monai_specs.py
    # imports monai.bundle directly, so declare it rather than rely on that.
    "monai >=1.4.0",
    "pydra-tasks-fastsurfer >=0.2.2",
    "pydra-tasks-freesurfer",
    "pydra-tasks-fsl",
    "pydra-tasks-mrtrix3 >=3.1.0a1",
]
license = "CC-BY-4.0"
authors = [{ name = "Thomas G. Close", email = "tom.g.close@gmail.com" }]
maintainers = [{ name = "Thomas G. Close", email = "tom.g.close@gmail.com" }]
keywords = ["file formats", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["black", "pre-commit", "codespell", "flake8", "flake8-pyproject"]
# NB: pydra-compose-monai and monai are runtime dependencies (see [project]
# dependencies), not test-only, so they are deliberately not repeated here.
# huggingface_hub stays: it is only needed by the sync/fetch tooling, via
# monai.bundle.download's monaihosting path, not by the installed package.
test = ["pytest >=6.2.5", "pytest-env>=0.6.2", "pytest-cov>=2.12.1", "frametree>=0.14.5", "xnat4tests>=0.3.14", "pydra2app>=0.18.8", "pydra2app-xnat>=0.8.2", "huggingface_hub"]


[project.urls]
repository = "https://github.com/Australian-Imaging-Service/pipelines"


[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/australianimagingservice/_version.py"

[tool.pyright]
reportAssignmentType = false

[tool.hatch.build.targets.wheel]
packages = ["src/australianimagingservice"]

[tool.black]
target-version = ['py38']
exclude = "src/australianimagingservice/_version.py"

[tool.codespell]
ignore-words = ".codespell-ignorewords"

[tool.flake8]
doctests = true
per-file-ignores = ["__init__.py:F401"]
max-line-length = 88
select = "C,E,F,W,B,B950"
extend-ignore = ['E203', 'E501', 'E129', 'W503']


[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
strict = true
namespace_packages = true
explicit_package_bases = true
exclude = ["tests", "scripts", "docs", "build", "dist"]
