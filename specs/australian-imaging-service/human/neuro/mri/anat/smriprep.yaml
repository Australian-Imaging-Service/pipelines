title: "Structural MRI data preprocessing pipeline"
schema_version: 2.0
version: &package_version "0.20.0"
authors:
  - name: Mahdieh Dashtbani-Moghari
    email: mahdieh.dashtbanimoghari@sydney.edu.au
  - name: Thomas G. Close
    email: thomas.close@sydney.edu.au
base_image:
  name: nipreps/smriprep
  tag: *package_version
  package_manager: apt
packages:
  pip:
    - pydra-tasks-dcm2niix
    - pydra-tasks-mrtrix3
    - pydra-compose-bidsapp
  neurodocker: # neurodocker templates freesurfer and fsl are already in smriprep image
    dcm2niix: v1.0.20250506
    mrtrix3:
      version: "3.0.4"
      args:
        method: source
        build_processes: "4"
licenses:
  freesurfer:
    destination: /opt/freesurfer/license.txt # where in the docker image it should be installed
    info_url: https://surfer.nmr.mgh.harvard.edu/registration.html
    description: >
      `sMRIPRep` uses FreeSurfer tools, which require a license to run.

docs:
  info_url: https://www.nipreps.org/smriprep/master/index.html
  description: |
    SMRIPrep: a structural MRI data preprocessing pipeline including Freesurfer
commands:
  smriprep:
    task:
      type: bidsapp
      app: /opt/conda/envs/smriprep/bin/smriprep
      inputs:
        t1w:
          type: medimage/nifti-gz-x
          help: "T1-weighted anatomical scan"
          path: anat/T1w
        T2w:
          type: medimage/nifti-gz-x?
          help: "T2-weighted anatomical scan"
          path: anat/T2w
          default: null
      outputs:
        t1w_preproc:
          type: medimage/nifti-gz-x
          help: Preprocessed T1-weighted image in native space
          path: anat/T1w/desc=preproc/nii.gz
        t1w_preproc_mni:
          type: medimage/nifti-gz-x
          help: Preprocessed T1-weighted image in MNI152NLin2009cAsym space
          path: anat/T1w/desc=preproc/space=MNI152NLin2009cAsym/nii.gz
        t1w_brain_mask:
          type: medimage/nifti-gz-x
          help: Brain mask of the T1-weighted image in native space
          path: anat/mask/desc=brain/nii.gz
        t1w_dseg:
          type: medimage/nifti-gz
          help: Tissue segmentation (CSF, GM, WM) of the T1-weighted image in native space
          path: anat/dseg/nii.gz
        figures:
          type: generic/directory
          help: Figures referenced by the HTML report
          path: figures
        report:
          type: text/html
          help: HTML report summarising the preprocessing
          path: ../sub-subject.html
    parameters:
      - flags
    operates_on: medimage/session
    configuration:
      work_dir: /work/nipype-work # We need to give a work directory outside of the pydra node as otherwise the file paths exceed Freesurfer's file-path char buffers
