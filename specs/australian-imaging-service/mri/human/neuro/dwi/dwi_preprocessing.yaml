title: "DWI Preprocessing"
schema_version: "2.0"
version: "0.1.0"
base_image:
  name: ubuntu
  tag: "22.04"
  package_manager: apt
packages:
  pip:
    setuptools:
    simplejson:
    acres:
    looseversion:
    fileformats-datascience:
    fileformats-medimage:
    fileformats-vendor-fsl:
    fileformats-vendor-mrtrix3: ">=3.1.0a6"
    pydra: 1.0a9
    pydra-tasks-mrtrix3:
    pydra-tasks-fsl:
    pydra-tasks-fastsurfer:
    fileformats:
    pydra2app:
    frametree:
    frametree-xnat:
    australianimagingservice:
    fileformats-medimage-extras:
  neurodocker:
    dcm2niix: v1.0.20250506
    mrtrix3:
      version: "3.0.4"
      args:
        method: source
        build_processes: "4"
    freesurfer:
      version: &freesurfer_version 7.4.1
      args:
        exclude_paths: |
          average/mult-comp-cor
          lib/cuda
          lib/qt
          subjects/V1_average
          subjects/bert
          subjects/cvs_avg35
          subjects/cvs_avg35_inMNI152
          subjects/fsaverage3
          subjects/fsaverage4
          subjects/fsaverage6
          subjects/fsaverage_sym
          trctrain
    fsl: 6.0.5.1
    ants: 2.5.0
authors:
  - name: Arkiev D'Souza
    email: arkiev.dsouza@sydney.edu.au
  - name: Thomas G. Close
    email: thomas.close@sydney.edu.au
docs:
  info_url: "https://placeholder.org"
  description: |
    Preprocess a DWI acquisition: gradient check, denoising, Gibbs removal,
    motion/distortion correction (eddy/topup), bias-field correction, brain
    masking (synthstrip), and tissue response function estimation.
commands:
  preprocess:
    task: australianimagingservice.mri.human.neuro.dwi.dwi_preprocessing:DwiPreprocessing
    operates_on: medimage/session
    sources:
      DWI:
        field: dwi_raw_mif
        help: "Main DWI acquisition (AP phase-encoded by default)"
      DwiRPE:
        field: rpe_file
        help: "Reverse phase-encoded companion scan (b0 SE-EPI or full DWI)"
        salience: secondary
    parameters:
      PEDirection:
        field: pe_dir
        help: "Phase-encoding direction of the main DWI (AP, PA, LR, RL, SI, IS)"
        default: AP
      RPEMode:
        field: rpe_mode
        help: "Reverse phase-encoding mode: rpe_none, rpe_pair, rpe_all, rpe_header"
        default: rpe_none
      FodAlgorithm:
        field: fod_algorithm
        help: "FOD estimation algorithm — msmt_csd (multi-shell) or ss3t (single-shell)"
        default: msmt_csd
