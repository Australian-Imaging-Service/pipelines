title: MONAI Spleen CT Segmentation
authors:
  - name: MONAI Consortium
    email: monai.contact@gmail.com
docs:
  info_url: https://monai.io/model-zoo.html
  description: >
    Spleen CT segmentation MONAI bundle from the MONAI Model Zoo, wrapped as a
    Pydra task and packaged for the Australian Imaging Service.
base_image:
  name: projectmonai/monai
  # Pinned rather than `latest`. The base image tag is part of the spec
  # checksum that `plan-builds` compares against the published image to decide
  # whether to rebuild, so with `latest` the checksum stays constant while the
  # image underneath it changes -- a new MONAI release would not trigger a
  # rebuild, and the published image would silently drift from the spec that
  # describes it. Pinning makes a MONAI bump a reviewable one-line change that
  # rebuilds as intended.
  #
  # Bump in step with the pydra-compose-monai floor below, which requires
  # monai >=1.4.
  tag: "1.6.1"
  package_manager: apt
packages:
  pip:
    # >=0.1.5 loads the bundle's checkpoint via ConfigWorkflow. Earlier
    # versions never ran the bundle's `initialize` section, so inference
    # ran with randomly-initialised weights and produced plausible-looking
    # but meaningless segmentations (Dice 0.0025 vs 0.9772 on MSD spleen_10).
    #
    # >=0.2.0 raises FileNotFoundError, carrying the bundle path, when the
    # bundle isn't on the host. The image re-loads this spec to resolve the
    # deferred task, so keep it in step with the build-host floor rather than
    # letting the two drift.
    pydra-compose-monai: ">=0.2.0"

operates_on: medimage/session
