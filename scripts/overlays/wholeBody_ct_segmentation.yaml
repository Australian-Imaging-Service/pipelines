title: MONAI Whole-Body CT Segmentation
authors:
  - name: MONAI Consortium
    email: monai.contact@gmail.com
docs:
  info_url: https://monai.io/model-zoo.html
  description: >
    SegResNet-based volumetric segmentation of 104 anatomical structures from
    a single-channel CT, from the MONAI Model Zoo, wrapped as a Pydra task and
    packaged for the Australian Imaging Service. The bundle declares 105 output
    channels: the 104 structures plus background.
base_image:
  name: projectmonai/monai
  # Pinned rather than `latest`. The base image tag is part of the spec
  # checksum that `plan-builds` compares against the published image to decide
  # whether to rebuild, so with `latest` the checksum stays constant while the
  # image underneath it changes -- a new MONAI release would not trigger a
  # rebuild, and the published image would silently drift from the spec that
  # describes it.
  #
  # Bump in step with the pydra-compose-monai floor below, which requires
  # monai >=1.4. The bundle's own metadata declares monai_version 1.4.0.
  tag: "1.6.1"
  package_manager: apt
packages:
  pip:
    # Overrides the bundle's own `pytorch-ignite: 0.4.11` pin, which is
    # otherwise propagated from metadata.json's required_packages_version.
    #
    # 0.4.11 (2022) relies on `enum` internals that Python 3.11 tightened, so
    # it installs but cannot be imported in the Python 3.11 conda env
    # pipeline2app builds:
    #
    #   AttributeError: 'CallableEventWithFilter' object has no attribute '_name_'
    #     at ignite/engine/events.py:200 in __hash__
    #
    # which surfaces as the bundle failing to instantiate SupervisedEvaluator.
    # 0.5.x declares `requires_python >=3.10,<3.15` and imports cleanly here.
    #
    # NB: the model was validated against 0.4.11, so this trades exact
    # fidelity for being runnable at all. Revisit if the bundle is republished
    # against a newer ignite.
    pytorch-ignite: ">=0.5"
    # >=0.1.5 loads the bundle's checkpoint via ConfigWorkflow. Earlier
    # versions never ran the bundle's `initialize` section, so inference
    # ran with randomly-initialised weights and produced plausible-looking
    # but meaningless segmentations.
    #
    # >=0.2.0 raises FileNotFoundError, carrying the bundle path, when the
    # bundle isn't on the host. The image re-loads this spec to resolve the
    # deferred task, so keep it in step with the build-host floor rather than
    # letting the two drift.
    pydra-compose-monai: ">=0.2.0"

operates_on: medimage/session
