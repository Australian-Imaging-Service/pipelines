# MONAI Model Zoo triage. This file records human decisions only -- models
# awaiting a decision are derived as (Zoo listing - models - declined) and
# reported by `python -m scripts.monai_specs triage`, so nothing here needs
# editing when the Zoo changes.

# Approved: generate and publish a spec.
# Each entry: version pin (null = latest) and anatomy placement in specs/ tree.
# The anatomy fields are human classification -- they are not present in bundle
# metadata, and they determine where the generated spec lands in the tree.
models:
  # Segments 104 structures from a single-channel CT, so it spans regions
  # rather than sitting in one -- hence `whole-body` rather than picking a
  # dominant region and misfiling the rest.
  wholeBody_ct_segmentation:
    version: null
    modality: ct
    species: human
    region: whole-body
    # Overrides what the bundle declares in metadata.json's
    # required_packages_version, for pins that don't work in the built image.
    package_overrides:
      # The bundle pins pytorch-ignite 0.4.11 (2022), which relies on `enum`
      # internals Python 3.11 tightened. It installs but cannot be imported in
      # the 3.11 conda env pipeline2app builds:
      #   AttributeError: 'CallableEventWithFilter' object has no attribute '_name_'
      # surfacing as the bundle failing to instantiate SupervisedEvaluator.
      # 0.5.x declares requires_python >=3.10,<3.15 and imports cleanly.
      # NB: trades exact fidelity (the model was validated against 0.4.11) for
      # being runnable at all. Revisit if the bundle is republished.
      pytorch-ignite: ">=0.5"

# Reviewed and deliberately not published.
#   reason:     why, for whoever reads the triage report later
#   at_version: the version reviewed. The model resurfaces in triage once the
#               Zoo moves past it -- bump to re-decline. Omit to decline every
#               version, for a reason that will never change.
declined: {}
